name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$RELEASE_VERSION" =~ $pattern ]] || {
            echo 'Use vMAJOR.MINOR.PATCH, for example v0.1.0.' >&2
            exit 1
          }

      - uses: actions/checkout@7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: make VERSION="${RELEASE_VERSION#v}" all

      - name: Package binary, completions, notices, and tap formula
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/package.py "$RELEASE_VERSION" "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            target=$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")
            [[ "$target" == "$GITHUB_SHA" ]] || {
              echo 'Existing tag points to another commit; refusing release.' >&2
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_VERSION" -f "sha=$GITHUB_SHA" --silent
          fi
          remote_target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq .sha)
          [[ "$remote_target" == "$GITHUB_SHA" ]] || {
            echo 'Remote tag does not match the built commit.' >&2
            exit 1
          }
          gh release create "$RELEASE_VERSION" "dist/$RELEASE_VERSION/"* \
            --verify-tag --title "$RELEASE_VERSION" --generate-notes
